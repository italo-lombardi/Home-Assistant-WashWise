name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: "actions/checkout@v7"
      - name: HASS validation
        uses: "home-assistant/actions/hassfest@master"

  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - name: Ruff check
        run: |
          pip install ruff==0.16.1
          ruff check
          ruff format --check

  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests/ --tb=short -q --cov-fail-under=100

  card-tests:
    name: Card JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run card tests
        run: |
          ls tests/frontend/*.test.mjs  # fail loudly if the glob matches nothing
          node --test 'tests/frontend/*.test.mjs'
